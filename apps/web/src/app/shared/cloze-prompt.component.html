<p class="fs-5 mb-3">
  @for (part of parts; track $index; let last = $last) {
    <span>{{ part }}</span>
    @if (!last) {
      <button class="btn btn-sm btn-outline-primary mx-1" type="button" (click)="clearBlank($index)">
        {{ values[$index] || '___' }}
      </button>
    }
  }
</p>
<p class="small text-muted mb-2">Opções disponíveis:</p>
<div class="d-flex flex-wrap gap-2">
  @for (chip of question.options; track $index) {
    <button
      class="btn btn-sm"
      [class.btn-primary]="isUsed(chip)"
      [class.btn-outline-secondary]="!isUsed(chip)"
      type="button"
      (click)="fill(chip)"
      [disabled]="values.length >= question.blank_count && !isUsed(chip)"
    >
      {{ chip }}
    </button>
  }
</div>
